<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>I-Speak AAC</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    :root {
      --bs-body-bg: #121212;
      --bs-body-color: #ffffff;
    }

    /* Native App Feel: Disable browser interactions & scrolling */
    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* 1. LAMP Top Sentence Bar */
    .lamp-sentence-bar {
      height: 62px;
      background: linear-gradient(#ffffff, #f4f6f9);
      display: flex;
      align-items: center;
      border-bottom: 1px solid #d6dbe3;
      padding: 4px 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 2;
    }
    .lamp-tokens-container {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .lamp-token {
      height: 52px;
      min-width: 40px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      flex-shrink: 0;
    }
    .lamp-token span {
      order: 2;
      font-size: 10px;
      font-weight: 800;
      color: #000000;
      line-height: 1;
    }
    .lamp-token img {
      order: 1;
      height: 30px;
      width: auto;
      object-fit: contain;
    }
    .lamp-delete-btn {
      width: 44px;
      height: 44px;
      background: #222222;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #444444;
      margin-left: 4px;
    }
    .lamp-delete-btn:active {
      background: #dc2626;
    }

    /* 2. Sub-Header Context Bar */
    .lamp-context-bar {
      height: 26px;
      background: linear-gradient(#1e293b, #16202f);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #0b1220;
    }

    /* 3. LAMP 84-Location Grid Layout (12x7) */
    .lamp-grid-wrapper {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #0f172a, #0b1220);
      padding: 3px;
    }
    .aac-grid {
      display: grid;
      gap: 3px;
      height: 100%;
      width: 100%;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(7, 1fr);
    }
    .aac-grid.fade-in {
      animation: gridFadeIn 0.16s ease-out;
    }
    @keyframes gridFadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* LAMP Tile Design */
    .aac-card {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      height: 100%;
      width: 100%;
      box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    }
    .aac-card:active {
      transform: scale(0.94);
      opacity: 0.85;
      box-shadow: none;
    }
    /* Real LAMP order: picture takes up most of the button, word sits in a strip at the bottom */
    .card-label {
      order: 2;
      font-family: 'Poppins', -apple-system, sans-serif;
      font-size: clamp(8px, 0.9vw, 11px);
      font-weight: 700;
      color: #000000;
      text-align: center;
      line-height: 1.1;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      padding-top: 1px;
      border-top: 1px solid rgba(0,0,0,0.15);
    }
    .aac-card img {
      order: 1;
      flex: 1;
      min-height: 0;
      max-height: 100%;
      max-width: 95%;
      object-fit: contain;
      pointer-events: none;
    }
    .aac-card.no-img {
      justify-content: center;
    }
    .aac-card.no-img .card-label {
      border-top: none;
      font-size: clamp(9px, 1.1vw, 13px);
    }

    /* Standard Fitzgerald Key Color Coding */
    .cg-yellow { background-color: #fef08a; } /* Pronouns */
    .cg-green  { background-color: #bbf7d0; } /* Verbs */
    .cg-orange { background-color: #fed7aa; } /* Nouns */
    .cg-pink   { background-color: #fbcfe8; } /* Social/Adjectives */
    .cg-blue   { background-color: #bae6fd; } /* Prepositions */
    .cg-white  { background-color: #ffffff; }

    .is-folder {
      border-color: #0f172a;
    }
    .is-folder::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 11px 11px 0;
      border-color: transparent #0f172a transparent transparent;
    }

    /* 4. Native Bottom Dock */
    .lamp-dock {
      height: 54px;
      background: linear-gradient(#0a0a0a, #000000);
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid #222222;
      padding: 2px 4px;
    }
    .dock-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'Poppins', -apple-system, sans-serif;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 14px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .dock-btn:active {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
    }
    .dock-btn:hover {
      color: #38bdf8;
    }
    .dock-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Loading Splash -->
  <div id="splash">
    <h4 class="text-white fw-bold mb-3">I-SPEAK AAC (LAMP)</h4>
    <div class="progress w-50" style="height: 6px;">
      <div id="loadBar" class="progress-bar bg-info" style="width: 0%"></div>
    </div>
  </div>

  <!-- Top Sentence Bar -->
  <div class="lamp-sentence-bar">
    <div class="lamp-tokens-container" id="speechTokens" onclick="speakPhrase()"></div>
    <div class="lamp-delete-btn" onclick="deleteLastToken()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
  </div>

  <!-- Sub-Header Context Bar -->
  <div class="lamp-context-bar">
    <span id="folderTitle">VOCAB: HOME</span>
    <span id="voiceLabel" class="text-muted">VOICE: DEFAULT</span>
  </div>

  <!-- 84-Location Grid -->
  <div class="lamp-grid-wrapper">
    <div class="aac-grid" id="grid"></div>
  </div>

  <!-- Bottom Native Navigation Dock -->
  <div class="lamp-dock">
    <button class="dock-btn" onclick="openKeyboard()">
      <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-3 0h2v2H5v-2zm0-3h2v2H5V8zm11 10H8v-2h8v2zm1-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
      Keyboard
    </button>
    <button class="dock-btn" onclick="goHome()">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="dock-btn" onclick="showBigText()">
      <svg viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
      Big Text
    </button>
    <div class="dropdown">
      <button class="dock-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
        <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.41 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        Voice
      </button>
      <ul class="dropdown-menu dropdown-menu-dark" id="voiceSelectMenu"></ul>
    </div>
  </div>

  <!-- Keyboard Modal -->
  <div class="modal fade" id="keyboardModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary py-2">
          <h6 class="modal-title">Type Custom Word</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="customInput" class="form-control form-control-lg mb-3" placeholder="Type word or phrase...">
          <button class="btn btn-primary w-100 fw-bold" onclick="submitCustomText()">Add to Sentence</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Big Text Fullscreen Modal -->
  <div class="modal fade" id="bigTextModal" tabindex="-1" onclick="closeBigText()">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-white d-flex align-items-center justify-content-center p-4">
        <h1 id="bigTextOverlay" class="display-1 fw-black text-center text-dark">READY</h1>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    let symbolLibrary = {};
    let boardConfig = {};
    let selectedTokens = [];
    let availableVoices = [];
    let selectedVoiceURI = localStorage.getItem('ispeak_voice_uri') || null;

    const grid = document.getElementById('grid');
    const speechTokens = document.getElementById('speechTokens');
    const folderTitle = document.getElementById('folderTitle');
    const voiceLabel = document.getElementById('voiceLabel');
    const voiceSelectMenu = document.getElementById('voiceSelectMenu');

    // Default LAMP 84-Grid High-Density Fallback
    const lampFallback84 = [
      { label: "finished", colorGroup: "white", symbol_ref: "finished" },
      { label: "mine", colorGroup: "white", symbol_ref: "mine" },
      { label: "little", colorGroup: "white", symbol_ref: "little" },
      { label: "up", colorGroup: "white", symbol_ref: "up" },
      { label: "yes", colorGroup: "white", symbol_ref: "yes" },
      { label: "good", colorGroup: "white", symbol_ref: "good" },
      { label: "some", colorGroup: "white", symbol_ref: "some" },
      { label: "no", colorGroup: "white", symbol_ref: "no" },
      { label: "down", colorGroup: "white", symbol_ref: "down" },
      { label: "out", colorGroup: "white", symbol_ref: "out" },
      { label: "off", colorGroup: "white", symbol_ref: "off" },
      { label: "bad", colorGroup: "white", symbol_ref: "bad" },

      { label: "me", colorGroup: "yellow", symbol_ref: "me" },
      { label: "my", colorGroup: "yellow", symbol_ref: "my" },
      { label: "wear", colorGroup: "white", symbol_ref: "wear" },
      { label: "am", colorGroup: "white", symbol_ref: "am" },
      { label: "please", colorGroup: "pink", symbol_ref: "please" },
      { label: "that", colorGroup: "pink", symbol_ref: "that" },
      { label: "and", colorGroup: "pink", symbol_ref: "and" },
      { label: "in", colorGroup: "green", symbol_ref: "in" },
      { label: "what", colorGroup: "orange", symbol_ref: "what" },
      { label: "a", colorGroup: "orange", symbol_ref: "a" },
      { label: "the", colorGroup: "orange", symbol_ref: "the" },
      { label: "there", colorGroup: "white", symbol_ref: "there" },

      { label: "I", colorGroup: "yellow", symbol_ref: "i" },
      { label: "we", colorGroup: "yellow", symbol_ref: "we" },
      { label: "are", colorGroup: "green", symbol_ref: "are" },
      { label: "is", colorGroup: "green", symbol_ref: "is" },
      { label: "were", colorGroup: "green", symbol_ref: "were" },
      { label: "was", colorGroup: "green", symbol_ref: "was" },
      { label: "on", colorGroup: "green", symbol_ref: "on" },
      { label: "to", colorGroup: "green", symbol_ref: "to" },
      { label: "can", colorGroup: "pink", symbol_ref: "can" },
      { label: "an", colorGroup: "pink", symbol_ref: "an" },
      { label: "the", colorGroup: "pink", symbol_ref: "the" },
      { label: "end", colorGroup: "white", symbol_ref: "end" },

      { label: "you", colorGroup: "yellow", symbol_ref: "you" },
      { label: "they", colorGroup: "yellow", symbol_ref: "they" },
      { label: "new", colorGroup: "white", symbol_ref: "new" },
      { label: "play", colorGroup: "pink", symbol_ref: "play" },
      { label: "like", colorGroup: "pink", symbol_ref: "like" },
      { label: "work", colorGroup: "pink", symbol_ref: "work" },
      { label: "have", colorGroup: "pink", symbol_ref: "have" },
      { label: "feel", colorGroup: "pink", symbol_ref: "feel" },
      { label: "read", colorGroup: "pink", symbol_ref: "read" },
      { label: "more", colorGroup: "blue", symbol_ref: "more" },
      { label: "fast", colorGroup: "blue", symbol_ref: "fast" },
      { label: "stop", colorGroup: "pink", symbol_ref: "stop" },

      { label: "it", colorGroup: "yellow", symbol_ref: "it" },
      { label: "he", colorGroup: "yellow", symbol_ref: "he" },
      { label: "want", colorGroup: "pink", symbol_ref: "want" },
      { label: "all", colorGroup: "pink", symbol_ref: "all" },
      { label: "come", colorGroup: "pink", symbol_ref: "come" },
      { label: "time", colorGroup: "white", symbol_ref: "time" },
      { label: "do", colorGroup: "pink", symbol_ref: "do" },
      { label: "go", colorGroup: "green", symbol_ref: "go" },
      { label: "get", colorGroup: "pink", symbol_ref: "get" },
      { label: "big", colorGroup: "blue", symbol_ref: "big" },
      { label: "color", colorGroup: "blue", symbol_ref: "color" },
      { label: "help", colorGroup: "pink", symbol_ref: "help" },

      { label: "she", colorGroup: "yellow", symbol_ref: "she" },
      { label: "look", colorGroup: "pink", symbol_ref: "look" },
      { label: "slow", colorGroup: "white", symbol_ref: "slow" },
      { label: "hear", colorGroup: "pink", symbol_ref: "hear" },
      { label: "think", colorGroup: "pink", symbol_ref: "think" },
      { label: "right", colorGroup: "pink", symbol_ref: "right" },
      { label: "said", colorGroup: "pink", symbol_ref: "said" },
      { label: "live", colorGroup: "pink", symbol_ref: "live" },
      { label: "love", colorGroup: "pink", symbol_ref: "love" },
      { label: "follow", colorGroup: "pink", symbol_ref: "follow" },
      { label: "ride", colorGroup: "pink", symbol_ref: "ride" },
      { label: "put", colorGroup: "pink", symbol_ref: "put" },

      { label: "CLEAR", colorGroup: "white", symbol_ref: "clear" },
      { label: "not", colorGroup: "white", symbol_ref: "not" },
      { label: "talk", colorGroup: "white", symbol_ref: "talk" },
      { label: "sit", colorGroup: "white", symbol_ref: "sit" },
      { label: "eat", colorGroup: "white", symbol_ref: "eat" },
      { label: "find", colorGroup: "white", symbol_ref: "find" },
      { label: "make", colorGroup: "white", symbol_ref: "make" },
      { label: "need", colorGroup: "white", symbol_ref: "need" },
      { label: "drink", colorGroup: "white", symbol_ref: "drink" },
      { label: "watch", colorGroup: "white", symbol_ref: "watch" },
      { label: "turn", colorGroup: "white", symbol_ref: "turn" },
      { label: "sleep", colorGroup: "white", symbol_ref: "sleep" }
    ];

    async function initApp() {
      try {
        document.getElementById('loadBar').style.width = '40%';
        const libRes = await fetch('symbols-library.json').catch(() => null);
        if (libRes && libRes.ok) symbolLibrary = await libRes.json();

        document.getElementById('loadBar').style.width = '80%';
        const boardRes = await fetch('board.json').catch(() => null);
        if (boardRes && boardRes.ok) boardConfig = await boardRes.json();

        const tilesToRender = (boardConfig && boardConfig.tiles) ? boardConfig.tiles : lampFallback84;
        renderBoard(tilesToRender, "HOME");

        document.getElementById('loadBar').style.width = '100%';
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.remove();
        }, 150);

        populateVoices();
      } catch (err) {
        renderBoard(lampFallback84, "HOME");
        populateVoices();
      }
    }

    function getSymbolPath(tile) {
      if (!tile.symbol_ref) return null;
      const ref = tile.symbol_ref;
      if (symbolLibrary[ref]) {
        return typeof symbolLibrary[ref] === 'string' ? symbolLibrary[ref] : symbolLibrary[ref].path;
      }
      return `symbols/${ref}.png`;
    }

    function renderBoard(tiles, folderName = "HOME") {
      grid.innerHTML = '';
      folderTitle.textContent = `VOCAB: ${folderName.toUpperCase()}`;

      // Restart the fade-in animation on every render (folder open, home, etc.)
      grid.classList.remove('fade-in');
      void grid.offsetWidth; // force reflow so the animation replays
      grid.classList.add('fade-in');

      tiles.forEach(tile => {
        const card = document.createElement('div');
        const colorGroup = tile.colorGroup || 'yellow';
        const isFolder = tile.type === 'folder';

        card.className = `aac-card cg-${colorGroup} ${isFolder ? 'is-folder' : ''}`;
        const imgPath = getSymbolPath(tile);

        card.innerHTML = `
          <span class="card-label">${tile.label}</span>
          ${imgPath ? `<img src="${imgPath}" alt="${tile.label}" onerror="handleImgError(this)">` : ''}
        `;

        if (!imgPath) card.classList.add('no-img');

        card.onclick = () => {
          if (navigator.vibrate) navigator.vibrate(8);
          if (tile.label === 'CLEAR') {
            clearText();
            return;
          }
          if (isFolder && tile.subGrid) {
            renderBoard(tile.subGrid, tile.label);
          } else {
            addToken(tile.label, imgPath, tile.speak || tile.label);
          }
        };

        grid.appendChild(card);
      });
    }

    function handleImgError(img) {
      const parent = img.parentElement;
      img.remove();
      if (parent) parent.classList.add('no-img');
    }

    function addToken(label, imgPath, speakText) {
      selectedTokens.push({ label, imgPath, speakText });
      renderTokens();
      speakWord(speakText);
    }

    function renderTokens() {
      speechTokens.innerHTML = '';
      selectedTokens.forEach(token => {
        const chip = document.createElement('div');
        chip.className = 'lamp-token';
        chip.innerHTML = `
          <span>${token.label}</span>
          ${token.imgPath ? `<img src="${token.imgPath}" onerror="this.remove()">` : ''}
        `;
        speechTokens.appendChild(chip);
      });
      speechTokens.scrollLeft = speechTokens.scrollWidth;
    }

    function deleteLastToken() {
      selectedTokens.pop();
      renderTokens();
    }

    function speakWord(text) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (availableVoices.length > 0) {
        let voiceObj = availableVoices.find(v => v.voiceURI === selectedVoiceURI);
        if (voiceObj) utterance.voice = voiceObj;
      }
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function speakPhrase() {
      if (selectedTokens.length === 0) return;
      const fullText = selectedTokens.map(t => t.speakText).join(' ');
      speakWord(fullText);
    }

    function clearText() {
      selectedTokens = [];
      renderTokens();
    }

    function populateVoices() {
      availableVoices = window.speechSynthesis.getVoices();
      if (availableVoices.length === 0) {
        setTimeout(populateVoices, 100);
        return;
      }

      voiceSelectMenu.innerHTML = '';
      availableVoices.forEach((voice) => {
        const isPersonal = voice.name.toLowerCase().includes('personal voice');
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item ${voice.voiceURI === selectedVoiceURI ? 'active' : ''} ${isPersonal ? 'fw-bold' : ''}" href="#" onclick="selectVoice('${voice.voiceURI}', '${voice.name}')">${voice.name} (${voice.lang})${isPersonal ? ' — Your Voice' : ''}</a>`;
        voiceSelectMenu.appendChild(li);
      });

      if (!selectedVoiceURI && availableVoices.length > 0) {
        // Prefer the user's own Apple Personal Voice if they've set one up,
        // then fall back to a high-quality system voice.
        const bestVoice =
          availableVoices.find(v => v.name.toLowerCase().includes('personal voice')) ||
          availableVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Enhanced') || v.name.includes('Natural'))) ||
          availableVoices[0];
        selectedVoiceURI = bestVoice.voiceURI;
        voiceLabel.textContent = `VOICE: ${bestVoice.name.toUpperCase()}`;
      } else if (selectedVoiceURI) {
        const currentVoice = availableVoices.find(v => v.voiceURI === selectedVoiceURI);
        if (currentVoice) voiceLabel.textContent = `VOICE: ${currentVoice.name.toUpperCase()}`;
      }
    }

    function selectVoice(uri, name) {
      selectedVoiceURI = uri;
      localStorage.setItem('ispeak_voice_uri', selectedVoiceURI);
      voiceLabel.textContent = `VOICE: ${name.toUpperCase()}`;
      populateVoices();
      speakWord("Voice updated");
    }

    function openKeyboard() {
      const modal = new bootstrap.Modal(document.getElementById('keyboardModal'));
      modal.show();
    }

    function submitCustomText() {
      const input = document.getElementById('customInput');
      if (input.value.trim()) {
        addToken(input.value.trim(), null, input.value.trim());
        input.value = '';
        bootstrap.Modal.getInstance(document.getElementById('keyboardModal')).hide();
      }
    }

    function showBigText() {
      const text = selectedTokens.length > 0 ? selectedTokens.map(t => t.label).join(' ') : "READY";
      document.getElementById('bigTextOverlay').textContent = text;
      const modal = new bootstrap.Modal(document.getElementById('bigTextModal'));
      modal.show();
    }

    function closeBigText() {
      const modalEl = document.getElementById('bigTextModal');
      const instance = bootstrap.Modal.getInstance(modalEl);
      if (instance) instance.hide();
    }

    function goHome() {
      const tilesToRender = (boardConfig && boardConfig.tiles) ? boardConfig.tiles : lampFallback84;
      renderBoard(tilesToRender, "HOME");
    }

    if (typeof window.speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    window.onload = initApp;
  </script>
</body>
</html>
