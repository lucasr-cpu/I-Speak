<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>I-Speak AAC</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --bs-body-bg: #2c3e50;
      --bs-body-color: #ffffff;
    }
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    }

    /* Proloquo2Go Pro Sentence Bar */
    .sentence-bar {
      min-height: 70px;
      background: #ffffff;
      border: 3px solid #1e293b;
      border-radius: 8px;
    }
    .token-chip {
      height: 52px;
      background: #f8fafc;
      border: 2px solid #0f172a;
      border-radius: 6px;
      padding: 2px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .token-chip img {
      height: 30px;
      width: auto;
      object-fit: contain;
    }
    .token-chip span {
      font-size: 10px;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
    }

    /* AAC Grid Cards */
    .aac-grid {
      display: grid;
      gap: 6px;
      height: 100%;
      width: 100%;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }
    @media (min-width: 576px) {
      .aac-grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); }
    }
    @media (min-width: 768px) {
      .aac-grid { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); }
    }

    .aac-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 3px solid #000000;
      border-radius: 8px;
      padding: 4px;
      font-weight: 800;
      box-shadow: 0 3px 0px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
    }
    .aac-card:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .aac-card img {
      max-height: 65%;
      max-width: 90%;
      object-fit: contain;
    }
    .card-label {
      font-size: clamp(10px, 1.8vw, 14px);
      color: #000000;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Fitzgerald Colors */
    .cg-yellow { background-color: #fef08a; } /* Pronouns */
    .cg-green  { background-color: #86efac; } /* Verbs */
    .cg-orange { background-color: #ffedd5; } /* Nouns */
    .cg-blue   { background-color: #bae6fd; } /* Adjectives */
    .cg-pink   { background-color: #fbcfe8; } /* Social */
    .cg-purple { background-color: #e9d5ff; } /* Questions */

    .is-folder::after {
      content: '📁';
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 12px;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #2c3e50;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="d-flex flex-column">

  <div id="splash">
    <h2 class="text-white fw-bold mb-3">I-SPEAK AAC</h2>
    <div class="progress w-50" style="height: 10px;">
      <div id="loadBar" class="progress-bar bg-success" style="width: 0%"></div>
    </div>
  </div>

  <!-- Proloquo2Go Top Bar -->
  <header class="d-flex flex-column gap-2 mb-2">
    <div class="d-flex align-items-center gap-2">
      <button id="backBtn" class="btn btn-warning fw-bold border-dark border-2" onclick="goHome()" style="display:none;">‹ HOME</button>
      <div class="sentence-bar flex-grow-1 d-flex align-items-center p-2 gap-2 overflow-x-auto" id="speechTokens" onclick="speakPhrase()"></div>
    </div>

    <div class="d-flex gap-1 justify-content-between">
      <select class="form-select form-select-sm border-dark border-2 fw-bold w-auto" id="voiceSelect" onchange="changeVoice()"></select>
      <div class="d-flex gap-1">
        <button class="btn btn-info btn-sm fw-bold border-dark border-2 text-white" onclick="openKeyboard()">KEYBOARD</button>
        <button class="btn btn-secondary btn-sm fw-bold border-dark border-2" onclick="showBigText()">BIG TEXT</button>
        <button class="btn btn-success btn-sm fw-bold border-dark border-2" onclick="speakPhrase()">SPEAK</button>
        <button class="btn btn-danger btn-sm fw-bold border-dark border-2" onclick="clearText()">CLEAR</button>
      </div>
    </div>
  </header>

  <!-- Main AAC Board -->
  <main class="flex-grow-1 min-vh-0">
    <div class="aac-grid" id="grid"></div>
  </main>

  <!-- Big Text Modal -->
  <div class="modal fade" id="bigTextModal" tabindex="-1" onclick="closeBigText()">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-white d-flex align-items-center justify-content-center p-4">
        <h1 id="bigTextOverlay" class="display-1 fw-black text-center text-dark">READY</h1>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    let symbolLibrary = {};
    let boardConfig = {};
    let selectedTokens = [];
    let availableVoices = [];
    let selectedVoiceURI = localStorage.getItem('ispeak_voice_uri') || null;
    let audioUnlocked = false;

    const grid = document.getElementById('grid');
    const speechTokens = document.getElementById('speechTokens');
    const backBtn = document.getElementById('backBtn');
    const voiceSelect = document.getElementById('voiceSelect');

    const expandedFallbackTiles = [
      { label: "I", colorGroup: "yellow", symbol_ref: "i" },
      { label: "me", colorGroup: "yellow", symbol_ref: "me" },
      { label: "want", colorGroup: "green", symbol_ref: "want" },
      { label: "go", colorGroup: "green", symbol_ref: "go" },
      { label: "stop", colorGroup: "green", symbol_ref: "stop" },
      { label: "food", colorGroup: "orange", symbol_ref: "food", type: "folder" },
      { label: "yes", colorGroup: "pink", symbol_ref: "yes" },
      { label: "no", colorGroup: "pink", symbol_ref: "no" }
    ];

    async function initApp() {
      try {
        document.getElementById('loadBar').style.width = '50%';
        const libRes = await fetch('symbols-library.json').catch(() => null);
        if (libRes && libRes.ok) symbolLibrary = await libRes.json();

        const boardRes = await fetch('board.json').catch(() => null);
        if (boardRes && boardRes.ok) boardConfig = await boardRes.json();

        const tilesToRender = (boardConfig && boardConfig.tiles) ? boardConfig.tiles : expandedFallbackTiles;
        renderBoard(tilesToRender, false);

        document.getElementById('loadBar').style.width = '100%';
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.remove();
        }, 200);

        populateVoices();
      } catch (err) {
        renderBoard(expandedFallbackTiles, false);
        populateVoices();
      }
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      const empty = new SpeechSynthesisUtterance("");
      window.speechSynthesis.speak(empty);
      audioUnlocked = true;
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function renderBoard(tiles, isSubFolder = false) {
      grid.innerHTML = '';
      backBtn.style.display = isSubFolder ? 'block' : 'none';

      tiles.forEach(tile => {
        const card = document.createElement('div');
        const colorGroup = tile.colorGroup || 'yellow';
        const isFolder = tile.type === 'folder';

        card.className = `aac-card cg-${colorGroup} ${isFolder ? 'is-folder' : ''}`;
        const imgPath = symbolLibrary[tile.symbol_ref] ? symbolLibrary[tile.symbol_ref].path : null;

        card.innerHTML = `
          <span class="card-label">${tile.label}</span>
          ${imgPath ? `<img src="${imgPath}" alt="${tile.label}">` : `<span class="fw-bold">${tile.label}</span>`}
        `;

        card.onclick = () => {
          if (isFolder && tile.subGrid) {
            renderBoard(tile.subGrid, true);
          } else {
            addToken(tile.label, imgPath, tile.speak || tile.label);
          }
        };

        grid.appendChild(card);
      });
    }

    function addToken(label, imgPath, speakText) {
      selectedTokens.push({ label, imgPath, speakText });
      renderTokens();
      speakWord(speakText);
    }

    function renderTokens() {
      speechTokens.innerHTML = '';
      selectedTokens.forEach(token => {
        const chip = document.createElement('div');
        chip.className = 'token-chip';
        chip.innerHTML = `
          ${token.imgPath ? `<img src="${token.imgPath}">` : ''}
          <span>${token.label}</span>
        `;
        speechTokens.appendChild(chip);
      });
      speechTokens.scrollLeft = speechTokens.scrollWidth;
    }

    /* Fixed Web Speech Engine Logic */
    function speakWord(text) {
      if (!text) return;
      
      // DO NOT call speechSynthesis.cancel() here as it resets iOS voice selection
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (availableVoices.length > 0) {
        let voiceObj = availableVoices.find(v => v.voiceURI === selectedVoiceURI);
        if (!voiceObj) voiceObj = availableVoices[0];
        utterance.voice = voiceObj;
      }

      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function speakPhrase() {
      if (selectedTokens.length === 0) return;
      window.speechSynthesis.cancel(); // Clear old queue before full phrase
      const fullText = selectedTokens.map(t => t.speakText).join(' ');
      speakWord(fullText);
    }

    function clearText() {
      selectedTokens = [];
      renderTokens();
    }

    function populateVoices() {
      availableVoices = window.speechSynthesis.getVoices();
      if (availableVoices.length === 0) {
        setTimeout(populateVoices, 100);
        return;
      }

      voiceSelect.innerHTML = '';
      availableVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.voiceURI === selectedVoiceURI) option.selected = true;
        voiceSelect.appendChild(option);
      });

      if (!selectedVoiceURI && availableVoices.length > 0) {
        const bestVoice = availableVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Enhanced') || v.name.includes('Natural'))) || availableVoices[0];
        selectedVoiceURI = bestVoice.voiceURI;
        voiceSelect.value = selectedVoiceURI;
      }
    }

    function changeVoice() {
      selectedVoiceURI = voiceSelect.value;
      localStorage.setItem('ispeak_voice_uri', selectedVoiceURI);
      speakWord("Voice changed");
    }

    function goHome() {
      const tilesToRender = (boardConfig && boardConfig.tiles) ? boardConfig.tiles : expandedFallbackTiles;
      renderBoard(tilesToRender, false);
    }

    if (typeof window.speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    window.onload = initApp;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
